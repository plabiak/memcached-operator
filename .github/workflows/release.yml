name: release (manual)
on:
  workflow_dispatch:
    inputs:
      release-as:
        type: choice
        default: auto
        options: [auto, patch, minor, major]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install dependencies
        run: npm install --no-save commit-and-tag-version
      - name: Bump version, changelog & tag
        run: |
          if [ "${{ inputs.release-as }}" = "auto" ]; then
            npx commit-and-tag-version
          else
            npx commit-and-tag-version --release-as ${{ inputs.release-as }}
          fi
      - name: Extract release notes
        run: |
          awk '/^## /{c++} c==1' CHANGELOG.md > RELEASE_NOTES.md
          sed -i -E 's/ \(\[[0-9a-f]{7}\]\([^)]*\)\)//g' RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Push commit & tag
        run: git push --follow-tags origin HEAD
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git describe --tags --abbrev=0)
          gh release create "$TAG" --notes-file RELEASE_NOTES.md
