name: release (manual)
on:
  workflow_dispatch:
    inputs:
      release-as:
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      published: ${{ steps.ver.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install dependencies
        run: npm install --no-save commit-and-tag-version
      - name: Bump version, changelog & tag
        run: |
          if [ "${{ inputs.release-as }}" = "auto" ]; then
            npx commit-and-tag-version
          else
            npx commit-and-tag-version --release-as ${{ inputs.release-as }}
          fi
      - name: Extract release notes
        run: |
          awk '/^## /{c++} c==1' CHANGELOG.md > RELEASE_NOTES.md
          sed -i -E 's/ \(\[[0-9a-f]{7}\]\([^)]*\)\)//g' RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Capture tag
        id: ver
        run: |
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "Brak nowego taga na HEAD - nic nie wydano."
            echo "published=false" >> $GITHUB_OUTPUT
          else
            echo "tag=$TAG"       >> $GITHUB_OUTPUT
            echo "published=true" >> $GITHUB_OUTPUT
          fi
      - name: Push commit & tag
        if: steps.ver.outputs.published == 'true'
        run: git push --follow-tags origin HEAD
      - name: Create GitHub Release
        if: steps.ver.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.ver.outputs.tag }}" --notes-file RELEASE_NOTES.md
